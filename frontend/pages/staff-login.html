<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Staff Login</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header class="header">
    <nav class="nav"><a class="brand" href="../index.html"><img src="../assets/logo.png" alt="GMARG" class="brand-logo"><span class="brandname">ग्राफिक मार्ग प्रा. लि.</span></a></nav>
  </header>
  <main class="login-shell">
    <section class="login-card">
      <div id="staffLoginPanel">
        <p class="eyebrow">Staff portal</p>
        <h1>Staff Login</h1>
        <div class="notice" id="loginNotice"></div>
        <form class="form" id="staffLoginForm">
          <input name="email" type="email" required placeholder="Staff email">
          <input name="password" type="password" required placeholder="Password">
          <button class="cta" type="submit">Login</button>
        </form>
        <p><a href="#" id="forgotPasswordLink">Forgot password?</a></p>
        <p><a href="login.html">← Back to login options</a></p>
      </div>
      <div id="forgotPasswordPanel" hidden>
        <p class="eyebrow">Staff password recovery</p>
        <h1>Forgot Password</h1>
        <div class="notice" id="forgotNotice"></div>
        <form class="form" id="staffPhoneForm">
          <input name="phone" type="tel" required placeholder="Staff phone number">
          <button class="cta" type="submit">Send OTP</button>
        </form>
        <form class="form" id="staffOtpForm" hidden>
          <input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="6-digit OTP">
          <button class="cta" type="submit">Verify OTP</button>
        </form>
        <form class="form" id="staffResetForm" hidden>
          <input name="password" type="password" minlength="8" maxlength="128" required placeholder="New password">
          <input name="confirmPassword" type="password" minlength="8" maxlength="128" required placeholder="Confirm new password">
          <button class="cta" type="submit">Reset password</button>
        </form>
        <p><a href="#" id="backToStaffLogin">← Back to staff login</a></p>
      </div>
    </section>
  </main>
  <script src="../js/api-config.js"></script>
  <script src="../js/staff-auth.js"></script>
</body>
</html>
